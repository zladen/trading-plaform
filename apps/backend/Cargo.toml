[package]
name = "platform-backend"
description = "HTTP and WebSocket API for the platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "platform-backend"
path = "src/main.rs"

[[bin]]
name = "platform-openapi"
path = "src/bin/openapi.rs"

[[bin]]
name = "platform-migrate"
path = "src/bin/migrate.rs"

[dependencies]
platform-application = { workspace = true }
platform-domain = { workspace = true }
platform-shared = { workspace = true }
platform-storage = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
