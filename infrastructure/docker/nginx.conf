# nginx configuration for the built frontend.
#
# Serves the static bundle and proxies `/api` to the backend so that the browser
# keeps using a single origin: no CORS preflight, and the WebSocket endpoint is
# reachable at the same path as in development.

server {
    # Unprivileged port: the container runs as the `nginx` user.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Written to the container filesystem, which is read-only for the process.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change, so they can be cached aggressively.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The API is proxied, never served from the bundle.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade for `/api/v1/ws`.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Long-lived WebSocket connections must not be cut by a read timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Single page application: unknown paths fall back to the app shell, but a
    # missing asset is a real 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not advertise the exact nginx version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
